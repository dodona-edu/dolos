name: Engine

on:
  push:
    branches: [main, dolos3.0]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: engine

jobs:
  changes:
    name: "Engine ⚙️ - changes 🔎"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Detect changes 🔎
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            engine:
              - 'engine/**'
              - '.github/workflows/engine.yml'

  build:
    name: "Engine ⚙️ - build 🔧 (${{ matrix.toolchain }})"
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v7
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo build --verbose --features all-languages

  lint:
    name: "Engine ⚙️ - lint 📏"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --features all-languages --all-targets -- -D warnings

  test:
    name: "Engine ⚙️ - test 🧪 (${{ matrix.toolchain }})"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v7
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --verbose --features all-languages

  wasm:
    name: "Engine ⚙️ - wasm 🕸"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo clippy --target wasm32-unknown-unknown -p dolos-core-wasm --all-targets -- -D warnings
      - run: wasm-pack build core-wasm --target web --release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/core-wasm/tests-typescript/package-lock.json
      - working-directory: engine/core-wasm/tests-typescript
        run: npm ci && npm run typecheck && npm test

  result:
    name: "Engine ⚙️ - all checks ✅"
    needs: [changes, build, lint, test, wasm]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check the job results 🔎
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job of this workflow failed or was cancelled."
          exit 1
