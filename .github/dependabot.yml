version: 2
updates:

  # API - Ruby/Bundler
  - package-ecosystem: "bundler"
    directory: "/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      api-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
      api-dependencies-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Root - NPM
  # The npm workspaces share the root package-lock.json. Keep one update entry
  # here so Dependabot updates workspace manifests and their lockfile together.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      root-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
      root-dependencies-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Docs - NPM
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docs-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
      docs-dependencies-version:
        applies-to: version-updates
        patterns:
          - "*"

  # API - Docker
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      api-docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      api-docker-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Root Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      root-docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      root-docker-version:
        applies-to: version-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    allow:
      - update-types:
          - "version-update:semver-major"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-version:
        applies-to: version-updates
        patterns:
          - "*"
